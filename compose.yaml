name: ${COMPOSE_PROJECT_NAME:-multiclicker}

services:
  frontend:
    build:
      context: ./frontend
    environment:
      ADMIN_PATH: ${ADMIN_PATH:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ${ACME_WEBROOT:-./.acme-webroot}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_PATH: ${ADMIN_PATH:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-1800}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    init: true
    restart: unless-stopped

  redis:
    # Matches the existing development server's reported version (8.10.2).
    image: redis:8.10.2
    command: ["redis-server", "--dir", "/data", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:

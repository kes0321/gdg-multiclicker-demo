include /etc/nginx/snippets/upstream.conf;

server {
    listen 80;
    server_name gdgclicker.duckdns.org;

    # These locations remain HTTP-accessible for healthchecks and renewals.
    include /etc/nginx/snippets/health-acme.conf;
    location / {
        # Preserve the method/body of API POST requests during redirection.
        return 308 https://gdgclicker.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gdgclicker.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/gdgclicker.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdgclicker.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # TLS terminates here; the shared proxy forwards X-Forwarded-Proto=https.
    include /etc/nginx/snippets/app.conf;
}

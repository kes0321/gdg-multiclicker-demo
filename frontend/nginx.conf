map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Refresh Docker DNS after backend recreation without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_app {
    zone backend_app 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No URI suffix on proxy_pass: /api/... is preserved. Cookie and
    # Set-Cookie headers pass through with their original host-only scope.
    location = /api {
        proxy_pass http://backend_app;
    }
    location ^~ /api/ {
        proxy_pass http://backend_app;
    }

    location = /ws {
        proxy_pass http://backend_app;
        # Repeat inherited headers because proxy_set_header inheritance is
        # replaced when any headers are defined in a child location.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /ws/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

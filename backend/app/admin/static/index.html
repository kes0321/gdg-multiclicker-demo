<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiclicker 관리자</title>
  <link rel="stylesheet" href="__ADMIN_PATH__/assets/admin.css">
  <script src="__ADMIN_PATH__/assets/admin.js" defer></script>
</head>
<body><main>
  <h1>Multiclicker 관리자</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="login">
    <label for="password">관리자 비밀번호</label>
    <input id="password" type="password" required maxlength="128" autocomplete="current-password">
    <button type="submit">로그인</button>
  </form>
  <section id="console" hidden>
    <header><strong>superadmin</strong><button id="refresh" type="button">새로고침</button><button id="logout" type="button">로그아웃</button></header>
    <p>전체 유저 목록 · 레벨 1~40, 골드 0 이상의 정수만 저장할 수 있습니다. 완전 삭제 시 데이터와 게임 세션이 삭제되며 복구할 수 없습니다.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>닉네임 / 유저 ID</th><th>보유 골드</th><th>레벨</th><th>관리</th></tr></thead>
      <tbody id="players"></tbody>
    </table></div>
    <footer><button id="previous" type="button" disabled>이전 페이지</button><button id="next" type="button" disabled>다음 페이지</button></footer>
  </section>
</main></body>
</html>
